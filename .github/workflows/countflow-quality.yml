name: CountFlow quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: countflow-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-streaming-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Type-check deployed CountFlow Edge Function sources
        run: deno check --no-lock functions/counting-export-session/index.ts functions/counting-provision-member/index.ts
      - name: Validate application scripts and streamed XLSX import
        run: node --test tests/unit/countflow-quality.test.mjs
      - name: Validate allowlisted Cloudflare Pages build
        run: bash scripts/build-pages.sh
      - name: Validate Playwright test discovery and public production shell
        working-directory: tests/e2e
        env:
          COUNTFLOW_BASE_URL: https://rawaea-app-countflow.pages.dev
          COUNTFLOW_EXPECTED_COMMIT: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run test:e2e -- --list
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep "production login shell"
